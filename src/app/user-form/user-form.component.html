<div class="container">
  <div class="header">
    <a (click)="onRetour()">
      <i class="fas fa-arrow-left"></i>
      {{ departementId ? "Nouvel employé" : "Nouvel apprenant" }} -
      {{ departementId ? "Département informatique" : "Cohorte" }}
    </a>
    <div class="matricule">
      Matricule : MAT-{{ departementId ? "EM" : "AP" }}-001
    </div>
  </div>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <div class="profile-pic">
        <img
          alt="Profile picture placeholder"
          height="100"
          src="https://storage.googleapis.com/a1aa/image/c5MgSATs7EYSMlugHCw0MLJgO0HANCurcqJ1kg4hhzPxcXAF.jpg"
          width="100"
        />
        <i class="fas fa-plus-circle"></i>
      </div>
    </div>
    <div class="form-group">
      <div class="half-width">
        <label for="nom">
          <span class="required">*</span>
          Nom
        </label>
        <input
          id="nom"
          formControlName="nom"
          placeholder="Entrer votre nom"
          type="text"
        />
      </div>
      <div class="half-width">
        <label for="prenom">
          <span class="required">*</span>
          Prenom
        </label>
        <input
          id="prenom"
          formControlName="prenom"
          placeholder="Entrer votre prenom"
          type="text"
        />
      </div>
    </div>
    <div class="form-group" *ngIf="departementId">
      <div class="half-width">
        <label for="poste">
          <span class="required">*</span>
          Poste
        </label>
        <input
          id="poste"
          formControlName="poste"
          placeholder="Ex : Développeur full stack"
          type="text"
        />
      </div>
      <div class="half-width">
        <label for="date-entree">
          <span class="required">*</span>
          Date d'entrée
        </label>
        <input
          id="date-entree"
          formControlName="dateEntree"
          placeholder="jj/mm/aaaa"
          type="text"
        />
      </div>
    </div>
    <div class="form-group">
      <div class="half-width">
        <label for="email">
          <span class="required">*</span>
          Email
        </label>
        <input
          id="email"
          formControlName="email"
          placeholder="Entrer votre email"
          type="email"
        />
      </div>
      <div class="half-width">
        <label for="telephone">
          <span class="required">*</span>
          Téléphone
        </label>
        <input
          id="telephone"
          formControlName="telephone"
          placeholder="Entrer votre téléphone"
          type="text"
        />
      </div>
    </div>
    <div class="buttons">
      <button type="button" class="btn-retour" (click)="onRetour()">
        RETOUR
      </button>
      <button type="submit" class="btn-enregistrer">Enregistrer</button>
    </div>
  </form>
</div>
