<!-- assignation-carte.component.html -->
<div class="app-container">
  <main class="main-content">
    <div class="card">
      <h2 class="card-title">Assignation de carte</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Nom complet</label>
          <input type="text" [value]="cardData.fullName" readonly class="form-control">
        </div>
        <div class="form-group">
          <label>Matricule</label>
          <input type="text" [value]="cardData.matricule" readonly class="form-control">
        </div>
        <div class="form-group">
          <label>Numero de carte</label>
          <input type="text" [(ngModel)]="cardData.cardID" placeholder="Scanner pour récupérer" class="form-control" [readonly]="!isScanning">
          <button class="btn btn-scanner" (click)="scanRFID()">Scanner RFID</button>
        </div>
        <div class="form-group">
          <label>Date d'assignation</label>
          <input type="date" [value]="cardData.assignmentDate" readonly class="form-control">
        </div>
      </div>
      <div class="card-status">
        <label>Etat de la carte</label>
        <div class="status-icon">
          <span class="checkmark">✓</span>
        </div>
      </div>
      <div class="button-group">
        <button class="btn btn-cancel" (click)="cancelAssignment()">Annuler</button>
        <button class="btn btn-confirm" (click)="openConfirmationModal()" [disabled]="!isScanning">Assigner</button>
      </div>
    </div>
  </main>
</div>

<!-- Modal de confirmation -->
<div id="confirmationModal" class="modal">
  <div class="modal-content">
    <h2>Confirmation</h2>
    <p>Êtes-vous sûr de vouloir assigner cet utilisateur ?</p>
    <div class="modal-actions">
      <button class="btn btn-cancel" (click)="closeConfirmationModal()">Non</button>
      <button class="btn btn-confirm" (click)="confirmAssignment()">Oui</button>
    </div>
  </div>
</div>

<!-- Modal de succès -->
<div id="successModal" class="modal">
  <div class="modal-content">
    <h2>Succès</h2>
    <p>La carte a été assignée avec succès !</p>
    <div class="modal-actions">
      <button class="btn btn-confirm" (click)="closeSuccessModal()">OK</button>
    </div>
  </div>
</div>
