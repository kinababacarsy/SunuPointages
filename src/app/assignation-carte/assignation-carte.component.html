<!-- card-assignment.component.html -->
<div class="app-container">
  <main class="main-content">
    <div class="card">
      <h2 class="card-title">Assignation de carte</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Nom complet</label>
          <input type="text" [value]="cardData.fullName" readonly class="form-control">
        </div>
        <div class="form-group">
          <label>Matricule</label>
          <input type="text" [value]="cardData.matricule" readonly class="form-control">
        </div>
        <div class="form-group">
          <label>Numero de carte</label>
          <input type="text" [(ngModel)]="cardData.cardNumber" placeholder="Scanner pour recuperer" class="form-control">
          <button class="btn btn-scanner" (click)="scanRFID()">Scanner RFID</button>
        </div>
        <div class="form-group">
          <label>Date d'assignation</label>
          <input type="text" [value]="cardData.assignmentDate" readonly class="form-control">
        </div>
      </div>
      <div class="card-status">
        <label>Etat de la carte</label>
        <div class="status-icon">
          <span class="checkmark">✓</span>
        </div>
      </div>
      <div class="button-group">
        <button class="btn btn-cancel" (click)="cancelAssignment()">Annuler</button>
        <button class="btn btn-confirm" (click)="confirmAssignment()">Confirmer l'assignation</button>
      </div>
    </div>
  </main>
</div>
